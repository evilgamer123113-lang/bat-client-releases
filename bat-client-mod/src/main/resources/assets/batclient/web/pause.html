<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Bat Client</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="hud-theme.css">
</head>
<body class="overlay-page pause-page">
    <!-- translucent backdrop: the paused Minecraft world stays visible behind it -->
    <div class="overlay-dim"></div>
    <img class="pause-watermark" src="bat-logo.png" alt="">

    <!-- ============ TOP-RIGHT ICON RAIL (Feather-style, no chat button) ============ -->
    <div class="pause-rail">
        <button class="pause-tool" data-action="serverlist" data-tip="SERVER LIST" aria-label="Server list">
            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round">
                <rect x="3" y="4.5" width="18" height="15" rx="3"/>
                <path d="M3 9.5h18M3 14.5h18"/>
            </svg>
        </button>
        <button class="pause-tool" data-action="screenshots" data-tip="SCREENSHOTS" aria-label="Screenshots">
            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 8V6.5A2.5 2.5 0 0 1 6.5 4H8M16 4h1.5A2.5 2.5 0 0 1 20 6.5V8M20 16v1.5a2.5 2.5 0 0 1-2.5 2.5H16M8 20H6.5A2.5 2.5 0 0 1 4 17.5V16"/>
                <rect x="8.5" y="8.5" width="7" height="7" rx="1.6"/>
            </svg>
        </button>
        <button class="pause-tool" data-action="resourcepacks" data-tip="RESOURCE PACKS" aria-label="Resource packs">
            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="4.5" width="18" height="5" rx="1.6"/>
                <path d="M5 9.5v8A2.5 2.5 0 0 0 7.5 20h9a2.5 2.5 0 0 0 2.5-2.5v-8"/>
                <path d="M10 13.5h4"/>
            </svg>
        </button>
        <button class="pause-tool" data-action="originalpause" data-tip="ORIGINAL PAUSE SCREEN" aria-label="Original pause screen">
            <svg viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="8" fill="none" stroke="#fff" stroke-width="1.9"/>
                <path d="M12 4a8 8 0 0 1 0 16z" fill="#fff"/>
            </svg>
        </button>
    </div>

    <!-- ============ CENTER MENU (Feather-style, Bat theme) ============ -->
    <div class="pause-center">
        <div class="pause-brand">
            <img class="pause-logo" src="bat-logo.png" alt="Bat Client logo">
            <span class="pause-name">BAT CLIENT</span>
        </div>

        <div class="pause-stack">
            <button class="pause-btn" data-action="resume">
                <svg class="pause-btn-ico" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 6l-6 6 6 6"/></svg>
                <span>Back to Game</span>
            </button>
            <button class="pause-btn" data-action="client-settings">
                <img class="pause-btn-ico pause-btn-ico-img" src="bat-logo.png" alt="">
                <span>Bat Client Settings</span>
            </button>
            <button class="pause-btn pause-btn-store" data-action="website">
                <svg class="pause-btn-ico" viewBox="0 0 24 24" fill="none" stroke="#101014" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M5.5 8h13l-1.1 11.2A2 2 0 0 1 15.4 21H8.6a2 2 0 0 1-2-1.8L5.5 8z"/>
                    <path d="M9 8a3 3 0 0 1 6 0"/>
                </svg>
                <span>STORE</span>
            </button>
            <button class="pause-btn" data-action="settings">
                <svg class="pause-btn-ico" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3"/>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.01a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h.01a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.01a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                </svg>
                <span>Options</span>
            </button>
            <button class="pause-btn" data-action="savequit">
                <svg class="pause-btn-ico" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M5 4h11l3 3v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1z"/>
                    <path d="M8 4v5h7V4M8 20v-6h8v6"/>
                </svg>
                <span>Save and Quit to Title</span>
            </button>
        </div>
    </div>

    <!-- ============ BOTTOM-RIGHT MINI ACTIONS ============ -->
    <div class="pause-foot">
        <button class="pause-mini" data-action="advancements">Advancements</button>
        <button class="pause-mini" data-action="statistics">Statistics</button>
        <button class="pause-mini" data-action="openworlds">Open World</button>
        <button class="pause-mini" id="pause-lan" data-action="opentolan">Open to LAN</button>
        <button class="pause-mini" data-action="mcfolder">Minecraft Folder</button>
    </div>

    <!-- ============ SCREENSHOTS BROWSER (page layer) ============ -->
    <div class="shots-layer hidden" id="shots-layer">
        <div class="shots-head">
            <div class="shots-title">
                <img src="bat-logo.png" alt="">
                <span>SCREENSHOTS</span>
                <span class="time-pill" id="shots-clock">&#9790;</span>
            </div>
            <button class="shots-x" data-action="shotsclose" aria-label="Close screenshots">&#10005;</button>
        </div>
        <div class="shots-panel">
            <div class="shots-grid" id="shots-grid"></div>
        </div>
        <div class="shots-foot">
            <button class="pause-mini" data-action="openshotsfolder">Open Folder</button>
        </div>
    </div>

    <!-- ============ SCREENSHOT VIEWER (lightbox over the shots grid) ============ -->
    <div class="shot-viewer hidden" id="shot-viewer">
        <button class="shots-x shot-viewer-x" data-action="shotviewerclose" aria-label="Close screenshot viewer">&#10005;</button>
        <button class="shot-nav" data-action="shotprev" aria-label="Previous screenshot">&#8249;</button>
        <div class="shot-viewer-stage">
            <img id="shot-view-img" alt="Screenshot">
            <div class="shot-viewer-bar">
                <span id="shot-viewer-name"></span>
                <span id="shot-viewer-count"></span>
                <button class="pause-mini" data-action="shotopenextern">Open Externally</button>
            </div>
        </div>
        <button class="shot-nav" data-action="shotnext" aria-label="Next screenshot">&#8250;</button>
    </div>

    <!-- ============ MOD MENU (Feather-style, Bat theme, no social/chat) ============ -->
    <div class="panel-layer mm-layer hidden" id="panel-layer">
        <div class="mm-win">
        <div class="mm-head">
            <div class="mm-title">
                <img src="bat-logo.png" alt="">
                <h1 id="headline">MOD MENU</h1>
                <span class="time-pill" id="mm-clock">&#9790;</span>
            </div>
            <div class="mm-tools">
                <button class="pause-tool" data-action="settings" data-tip="MC SETTINGS" aria-label="Minecraft settings">
                    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="3"/>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.01a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h.01a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.01a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                    </svg>
                </button>
            </div>
        </div>

        <div class="mm-tabs">
            <button class="nav-item mm-tab active" data-view="mods">
                <svg viewBox="0 0 24 24" fill="currentColor" stroke="none" aria-hidden="true"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg>
                MOD MENU
            </button>
            <button class="nav-item mm-tab mm-tab-i" data-view="settings" data-tip="SETTINGS" aria-label="Settings">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.01a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h.01a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.01a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            </button>
            <button class="nav-item mm-tab mm-tab-i" data-view="cosmetics" data-tip="COSMETICS" aria-label="Cosmetics">
                <svg viewBox="0 0 64 64" fill="currentColor" stroke="none" aria-hidden="true"><path d="M8 18 C12 10 20 8 27 12 C30 18 24 22 24 22 C24 22 18 16 14 18 C10 20 10 24 12 27 C15 31 20 30 23 28 C23 32 22 36 20 40 C18 38 14 38 12 40 C16 46 22 48 28 47 C28 52 27 56 26 60 L20 58 L18 63 L32 63 L44 60 L42 63 L36 58 L30 61 C30 52 30 44 32 40 C34 44 36 47 40 49 C44 50 48 48 50 44 C50 42 48 40 46 40 C46 40 44 40 42 40 C44 36 45 32 45 28 C50 30 57 31 60 27 C62 24 62 20 58 18 C54 16 48 22 48 22 C48 22 42 18 45 12 C52 8 60 10 64 18 C60 22 58 24 56 26 C54 28 52 30 52 34 C52 36 52 38 52 40 C56 40 58 42 58 44 C58 48 54 50 52 50 C46 48 40 42 38 36 C38 38 38 42 38 46 C38 50 36 54 32 56 C28 54 26 50 26 46 C26 42 26 38 26 36 C24 42 18 48 12 50 C10 50 6 48 6 44 C6 42 8 40 12 40 C12 38 12 36 12 34 C12 30 10 28 8 26 C6 24 6 20 8 18 Z"/></svg>
            </button>
            <button class="shots-x mm-x" data-action="back" aria-label="Close mod menu">&#10005;</button>
        </div>

        <div class="mm-body">
            <div class="mm-panel">
            <!-- modules grid -->
            <section id="view-mods">
                <div class="mm-sub">
                    <button class="mm-subtab active" data-cat="all">All</button>
                    <button class="mm-subtab" data-cat="hud">HUD</button>
                    <button class="mm-subtab" data-cat="qol">QoL</button>
                    <button class="mm-subtab" data-cat="perf">Performance</button>
                    <button class="mm-subtab" data-cat="custom">Customization</button>
                    <input class="mm-search" id="mm-search" type="text" placeholder="Search" spellcheck="false">
                    <button class="mm-subicon" id="mm-fav" data-tip="FAVORITES" aria-label="Favorites only">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7.5-4.7-9.5-9A5.4 5.4 0 0 1 12 6.6 5.4 5.4 0 0 1 21.5 12c-2 4.3-9.5 9-9.5 9z"/></svg>
                    </button>
                    <button class="mm-subicon" id="mm-gridbtn" data-tip="GRID DENSITY" aria-label="Toggle grid density">
                        <svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg>
                    </button>
                </div>
                <div class="mod-grid" id="mod-grid"></div>

                <!-- per-module settings page (gear on a card) -->
                <div class="mod-settings hidden" id="mod-settings">
                    <button class="ms-back" id="ms-back" aria-label="Back to modules">&#8249;</button>
                    <div class="ms-head">
                        <div class="ms-desc">
                            <svg viewBox="0 0 24 24" fill="none" stroke="#89899a" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>
                            <span id="ms-desc"></span>
                        </div>
                        <div class="ms-actions">
                            <button class="ms-move" id="ms-move" data-tip="MOVE ON HUD" aria-label="Move widget on HUD">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M3 12h18M12 3l-3 3M12 3l3 3M12 21l-3-3M12 21l3-3M3 12l3-3M3 12l3 3M21 12l-3-3M21 12l-3 3"/></svg>
                            </button>
                            <button class="ms-pv active" id="ms-pv">Mod Preview</button>
                        </div>
                    </div>
                    <div class="ms-cols">
                        <div class="ms-sections" id="ms-sections"></div>
                        <div class="ms-preview-wrap" id="ms-preview-wrap">
                            <div class="ms-preview" id="ms-preview"></div>
                        </div>
                    </div>
                </div>
            </section>

            <section class="card hidden" id="view-settings">
                <div class="card-row">
                    <div class="card-row-text">
                        <div class="card-row-title">RGB</div>
                        <div class="card-row-desc">Cycle through rainbow colors (client)</div>
                    </div>
                    <label class="switch"><input type="checkbox" id="rgb"><span></span></label>
                </div>
                <div class="card-row">
                    <div class="card-row-text">
                        <div class="card-row-title">Discord Presence</div>
                        <div class="card-row-desc">Show Bat Client on your Discord profile</div>
                    </div>
                    <label class="switch"><input type="checkbox" id="discord"><span></span></label>
                </div>
            </section>

            <section class="card hidden" id="view-cosmetics">
                <div class="card-row">
                    <div class="card-row-text">
                        <div class="card-row-title">Animated Cape</div>
                        <div class="card-row-desc">Wavey animated cape from Bat Cosmetics</div>
                    </div>
                    <label class="switch"><input type="checkbox" id="cape" checked><span></span></label>
                </div>
            </section>
            </div><!-- /mm-panel -->
        </div>
        </div><!-- /mm-win -->
    </div>

    <script src="app.js"></script>
    <script src="client-tools.js"></script>
    <script src="waypoints.js"></script>
</body>
</html>
