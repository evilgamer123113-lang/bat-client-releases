allprojects {
    if (gradle.startParameter.projectProperties.containsKey('flightEngine')) {
        plugins.withId('fabric-loom') {
            dependencies.add('modLocalRuntime',files('build/performance-dependencies/sodium-0.5.11.jar'))
        }
    }
    if (gradle.startParameter.projectProperties.containsKey('flightGeneration')) {
        plugins.withId('fabric-loom') {
            dependencies.add('modLocalRuntime',files('build/performance-dependencies/noisium-2.3.0.jar'))
        }
    }
    afterEvaluate {
        def baseline=project.hasProperty('flightBaseline')
        def variant=baseline?'baseline-v120':project.hasProperty('flightGeneration')?'engine-sodium-noisium':project.hasProperty('flightEngine')?'sodium-0511':'no-worker-cap'
        def runPath='build/flight-native-'+variant
        def runRoot=file(runPath)
        loom.runs.named('client') { runDir runPath }
        def compileSmoke=tasks.register('compileFlightSmoke',JavaCompile) {
            source file('scripts/FlightRuntimeSmoke.java')
            classpath=sourceSets.main.compileClasspath
            destinationDirectory=layout.buildDirectory.dir('flight-smoke-classes')
            options.release=21
        }
        def metadata=tasks.register('flightSmokeMetadata') {
            def directory=layout.buildDirectory.dir('flight-smoke-metadata')
            outputs.dir directory
            doLast {
                def target=directory.get().file('fabric.mod.json').asFile;target.parentFile.mkdirs()
                target.setText('{"schemaVersion":1,"id":"bat_flight_smoke","version":"1.0.0","environment":"client","entrypoints":{"client":["FlightRuntimeSmoke"]}}','UTF-8')
            }
        }
        def smokeJar=tasks.register('jarFlightSmoke',Jar) {
            dependsOn compileSmoke,metadata
            archiveFileName='flight-smoke.jar'
            destinationDirectory=new File(runRoot,'mods')
            from compileSmoke.flatMap {it.destinationDirectory}
            from layout.buildDirectory.dir('flight-smoke-metadata')
        }
        tasks.named('runClient') {
            dependsOn smokeJar
            environment 'ALSOFT_DRIVERS','null'
            jvmArgs '-Dbat.flight.variant='+variant
            if(baseline) {
                def old=file('build/flight-profile/baseline-v120.jar')
                if(!old.isFile())throw new GradleException('Baseline missing')
                classpath=files(classpath.files.findAll{!it.absolutePath.contains('protected-runs')},old)
                setJvmArgs(jvmArgs.findAll{!it.startsWith('-Dfabric.classPathGroups=')})
                jvmArgs '-Dfabric.classPathGroups='+old.absolutePath
            }
        }
    }
}
