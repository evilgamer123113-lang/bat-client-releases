name: Rust launcher signed native packages
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
          - runner: macos-14
            target: aarch64-apple-darwin
            bundles: app,dmg
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: launcher-rust
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.BAT_RUST_UPDATER_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.BAT_RUST_UPDATER_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev libxdo-dev
      - name: Require the existing release signing key
        shell: bash
        run: test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo 'Configure BAT_RUST_UPDATER_PRIVATE_KEY before building signed updates.'; exit 1; }
      - name: Native regression suite
        run: cargo test --locked --release --features custom-protocol --manifest-path src-tauri/Cargo.toml
      - name: Build signed native packages
        run: npm exec --yes --package @tauri-apps/cli@2 -- tauri build --target '${{ matrix.target }}' --bundles '${{ matrix.bundles }}'
      - uses: actions/upload-artifact@v4
        with:
          name: rust-launcher-${{ matrix.target }}
          path: launcher-rust/src-tauri/target/${{ matrix.target }}/release/bundle/
          if-no-files-found: error
# Artifact-only workflow: no GitHub release publication or production deployment.
